name: Temporary persistent airgap validation
on: [push]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y nftables shellcheck
      - run: shellcheck setup.sh && bash -n setup.sh
      - name: Validate generated nftables config
        run: |
          cat >/tmp/nftables.conf <<'EOF'
          flush ruleset
          table inet glacier2 {
           chain input { type filter hook input priority -300; policy drop; iifname "lo" accept; }
           chain output { type filter hook output priority -300; policy drop; oifname "lo" accept; }
          }
          EOF
          sudo nft -c -f /tmp/nftables.conf
      - name: Validate generated systemd unit
        run: |
          cat >/tmp/glacier-airgap.service <<'EOF'
          [Unit]
          Description=Glacier permanent airgap
          Wants=network-pre.target
          Before=network-pre.target
          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'rfkill block all; for i in /sys/class/net/*; do n=${i##*/}; [ "$n" = lo ] || ip link set "$n" down; done'
          RemainAfterExit=yes
          [Install]
          WantedBy=multi-user.target
          EOF
          systemd-analyze verify /tmp/glacier-airgap.service
