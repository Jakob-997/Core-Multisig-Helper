name: Temporary rollback verification
on: [push]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck jq xorriso
          bash -n setup.sh
          shellcheck setup.sh
          ! grep -Eq '\\b(curl|wget|apt|git)\\b' setup.sh
          grep -q 'timestamp:0' setup.sh
          grep -Fq 'cp "$STATE/descriptors.txt" "$STATE/cd/"' setup.sh
          ! grep -Fq 'bitcoin-core.tar.gz "$STATE/cd/"' setup.sh
          echo '0255103718033e6aee15fa944717fc277e047b845bff1e7408af0ea732d8d0c1  bitcoin-core.tar.gz' | sha256sum -c -

      - name: Wallet and media regression
        run: |
          set -Eeuo pipefail
          T=/tmp/cmh
          C=$T/core
          D=$T/data
          mkdir -p "$C" "$D"
          tar -xzf bitcoin-core.tar.gz --strip-components=1 -C "$C"
          "$C/bin/bitcoind" -regtest -datadir="$D" -daemonwait -networkactive=0 -listen=0 -fallbackfee=0.0002 -rpcport=18459
          rpc(){ "$C/bin/bitcoin-cli" -regtest -datadir="$D" -rpcport=18459 "$@"; }
          node(){ local m=$1; shift; printf '%s\n' "$@" | rpc -stdin "$m"; }
          wallet(){ local w=$1 m=$2; shift 2; printf '%s\n' "$@" | rpc -rpcwallet="$w" -stdin "$m"; }
          trap 'rpc stop >/dev/null 2>&1 || true' EXIT

          M=2
          N=4
          declare -a origin xpub xprv
          for ((i=1;i<=N;i++)); do
            w=signer_$i
            node createwallet "$w" false true >/dev/null
            root=$(rpc -rpcwallet="$w" addhdkey | jq -r .xpub)
            account=$(wallet "$w" derivehdkey m/87h/0h/0h "{\"hdkey\":\"$root\",\"private\":true}")
            origin[i]=$(jq -r .origin <<<"$account")
            xpub[i]=$(jq -r .xpub <<<"$account")
            xprv[i]=$(jq -r .xprv <<<"$account")
          done

          raw="wsh(sortedmulti($M"
          for ((i=1;i<=N;i++)); do raw+=",${origin[i]}${xpub[i]}/<0;1>/*"; done
          raw+='))'
          info=$(node getdescriptorinfo "$raw")
          test "$(jq '.multipath_expansion|length' <<<"$info")" = 2
          checksum=$(jq -r .checksum <<<"$info")
          public="$raw#$checksum"
          printf '%s\n' "$public" > "$T/descriptors.txt"

          node createwallet watch_only true true >/dev/null
          request=$(jq -cn --arg desc "$public" '[{desc:$desc,active:true,timestamp:0,range:[0,999]}]')
          wallet watch_only importdescriptors "$request" | jq -e '.[0].success == true'
          rpc -rpcwallet=watch_only getwalletinfo | jq -e '.private_keys_enabled == false'

          for ((i=1;i<=N;i++)); do
            private="${raw/${xpub[i]}/${xprv[i]}}"
            checksum=$(node getdescriptorinfo "$private" | jq -r .checksum)
            request=$(jq -cn --arg desc "$private#$checksum" '[{desc:$desc,active:true,timestamp:0,range:[0,999]}]')
            wallet "signer_$i" importdescriptors "$request" | jq -e '.[0].success == true'
          done

          addr=$(rpc -rpcwallet=watch_only getnewaddress)
          test "$addr" = "$(rpc -rpcwallet=signer_1 getnewaddress)"
          test "$addr" = "$(rpc -rpcwallet=signer_2 getnewaddress)"

          mine=$(rpc -rpcwallet=watch_only getnewaddress)
          rpc generatetoaddress 101 "$mine" >/dev/null
          dest=$(rpc -rpcwallet=signer_4 getnewaddress)
          psbt=$(rpc -rpcwallet=watch_only -named walletcreatefundedpsbt inputs='[]' outputs="{\"$dest\":1}" | jq -r .psbt)
          p1=$(rpc -rpcwallet=signer_1 walletprocesspsbt "$psbt" | jq -r .psbt)
          p2=$(rpc -rpcwallet=signer_2 walletprocesspsbt "$psbt" | jq -r .psbt)
          combined=$(rpc combinepsbt "[\"$p1\",\"$p2\"]")
          rpc finalizepsbt "$combined" | jq -e '.complete == true'

          rpc -rpcwallet=watch_only backupwallet "$T/watch_only.dat"
          rpc -rpcwallet=signer_1 backupwallet "$T/signer.dat"

          mkdir "$T/watchstage"
          cp "$T/descriptors.txt" "$T/watchstage/"
          cp "$T/watch_only.dat" "$T/watchstage/"
          xorriso -as mkisofs -quiet -r -J -o "$T/watch.iso" "$T/watchstage"
          mkdir "$T/watchout"
          xorriso -osirrox on -indev "$T/watch.iso" -extract / "$T/watchout" >/dev/null 2>&1
          test "$(find "$T/watchout" -maxdepth 1 -type f | wc -l)" -eq 2
          test -f "$T/watchout/watch_only.dat"
          test -f "$T/watchout/descriptors.txt"
          test ! -e "$T/watchout/wallet.dat"
          test ! -e "$T/watchout/setup.sh"
          test ! -e "$T/watchout/bitcoin-core.tar.gz"

          mkdir "$T/signstage"
          cp "$T/descriptors.txt" "$T/signstage/"
          cp "$T/signer.dat" "$T/signstage/wallet.dat"
          xorriso -as mkisofs -quiet -r -J -o "$T/signer.iso" "$T/signstage"
          mkdir "$T/signout"
          xorriso -osirrox on -indev "$T/signer.iso" -extract / "$T/signout" >/dev/null 2>&1
          test "$(find "$T/signout" -maxdepth 1 -type f | wc -l)" -eq 2
          test -f "$T/signout/wallet.dat"
          test -f "$T/signout/descriptors.txt"
          test ! -e "$T/signout/watch_only.dat"
          test ! -e "$T/signout/setup.sh"
          test ! -e "$T/signout/bitcoin-core.tar.gz"

          rpc unloadwallet watch_only >/dev/null
          rpc unloadwallet signer_1 >/dev/null
          rpc restorewallet restored_watch "$T/watch_only.dat" | jq -e '.name == "restored_watch"'
          rpc -rpcwallet=restored_watch getwalletinfo | jq -e '.private_keys_enabled == false'
          rpc restorewallet restored_signer "$T/signer.dat" | jq -e '.name == "restored_signer"'
          rpc -rpcwallet=restored_signer getwalletinfo | jq -e '.private_keys_enabled == true'

          rpc stop
          trap - EXIT
          sleep 1

          L=$T/load
          mkdir -p "$L/wallets/signer"
          cp "$T/signer.dat" "$L/wallets/signer/wallet.dat"
          "$C/bin/bitcoind" -regtest -datadir="$L" -walletdir="$L/wallets" -daemonwait -networkactive=0 -listen=0 -rpcport=18460 -wallet=signer
          "$C/bin/bitcoin-cli" -regtest -datadir="$L" -rpcport=18460 -rpcwallet=signer getwalletinfo | jq -e '.private_keys_enabled == true'
          "$C/bin/bitcoin-cli" -regtest -datadir="$L" -rpcport=18460 stop
