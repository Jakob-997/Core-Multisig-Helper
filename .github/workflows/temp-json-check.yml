name: Temporary JSON check
on: [push]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck jq
      - run: bash -n setup.sh && shellcheck setup.sh
      - run: |
          raw='wsh(sortedmulti(2,[deadbeef/87h/0h/0h]xpubTEST/<0;1>/*,[cafebabe/87h/0h/0h]xpubTEST2/<0;1>/*))'
          checksum=abcd1234
          request=$(jq -cn --arg desc "$raw#$checksum" '[{desc:$desc,active:true,timestamp:"now",range:[0,999]}]')
          jq -e '.[0].desc and .[0].active == true and .[0].timestamp == "now" and .[0].range == [0,999]' <<<"$request"
