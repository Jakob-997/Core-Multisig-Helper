name: Temporary airgap service regression
on: [push]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y nftables shellcheck
      - run: shellcheck setup.sh && bash -n setup.sh
      - name: Validate nftables syntax
        run: |
          cat >/tmp/glacier.nft <<'EOF'
          flush ruleset
          table inet glacier2 {
           chain input { type filter hook input priority -300; policy drop; iifname "lo" accept; }
           chain output { type filter hook output priority -300; policy drop; oifname "lo" accept; }
          }
          EOF
          sudo nft -c -f /tmp/glacier.nft
      - name: Ensure optional hardening failures do not fail service
        run: |
          mkdir /tmp/fakebin
          printf '#!/bin/sh\nexit 1\n' >/tmp/fakebin/rfkill
          printf '#!/bin/sh\nexit 1\n' >/tmp/fakebin/ip
          chmod +x /tmp/fakebin/rfkill /tmp/fakebin/ip
          PATH=/tmp/fakebin:$PATH /bin/sh -c 'rfkill block all 2>/dev/null || true; for i in /sys/class/net/*; do n=${i##*/}; [ "$n" = lo ] || ip link set "$n" down 2>/dev/null || true; done'
