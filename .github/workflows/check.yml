name: Minimal candidate check
on: [push]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck jq
      - run: shellcheck setup.sh && bash -n setup.sh
      - name: Test in-script wallet construction
        run: |
          set -euo pipefail
          mkdir /tmp/core /tmp/data /tmp/state
          tar -xzf bitcoin-core.tar.gz --strip-components=1 -C /tmp/core
          sed '/^\[\[ \$EUID/,$d' setup.sh >/tmp/functions.sh
          source /tmp/functions.sh
          CORE=/tmp/core
          DATA=/tmp/data
          STATE=/tmp/state
          /tmp/core/bin/bitcoind -datadir=/tmp/data -server -daemonwait -networkactive=0 -listen=0 -rpcport=18459 -debuglogfile=0
          trap '/tmp/core/bin/bitcoin-cli -datadir=/tmp/data -rpcport=18459 stop || true' EXIT
          make_wallet
          test "$(/tmp/core/bin/bitcoin-cli -datadir=/tmp/data -rpcport=18459 listwallets | jq 'length')" -eq 7
          test "$(wc -l </tmp/state/descriptors.txt)" -eq 2
          while read -r d; do
            [[ "$d" == wsh\(sortedmulti\(3,* ]]
          done </tmp/state/descriptors.txt
          for n in {1..7}; do
            /tmp/core/bin/bitcoin-cli -datadir=/tmp/data -rpcport=18459 -rpcwallet=signer_$n listdescriptors false |
              jq -e '[.descriptors[] | select(.active)] | length == 2' >/dev/null
          done
