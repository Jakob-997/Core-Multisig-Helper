name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck xorriso
      - run: bash tests/check.sh
      - name: 3-of-7 recovery test
        run: |
          mkdir /tmp/core
          tar -xzf vendor/bitcoin-32.0rc2-x86_64-linux-gnu.tar.gz -C /tmp/core
          python3 tests/integration.py /tmp/core/bitcoin-32.0rc2/bin
