name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run: shellcheck setup.sh && bash -n setup.sh && python3 -m py_compile wallets.py tests/integration.py
      - run: |
          mkdir /tmp/core
          tar -xzf vendor/bitcoin-32.0rc2-x86_64-linux-gnu.tar.gz -C /tmp/core
          python3 tests/integration.py /tmp/core/bitcoin-32.0rc2/bin
