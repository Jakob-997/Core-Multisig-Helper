name: Temporary bundle xorriso
on:
  push:
    branches: [simplify-auditability]
permissions:
  contents: write
jobs:
  bundle:
    if: ${{ !contains(github.event.head_commit.message, 'Bundle Ubuntu 26.04 xorriso packages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-auditability
      - name: Download official Ubuntu 26.04 xorriso packages
        run: |
          mkdir -p packages
          docker run --rm -v "$PWD/packages:/out" ubuntu:26.04 bash -lc '
            apt-get update
            cd /out
            apt-get download xorriso libisoburn1t64 libburn4t64 libisofs6t64
          '
          sha256sum packages/*.deb > packages/SHA256SUMS
      - name: Commit package bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "Bundle Ubuntu 26.04 xorriso packages"
          git push origin HEAD:simplify-auditability
