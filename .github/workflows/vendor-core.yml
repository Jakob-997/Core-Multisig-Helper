name: Vendor Bitcoin Core
on:
  push:
    branches: [simplify-auditability]
    paths: [.github/workflows/vendor-core.yml]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-auditability
      - name: Download reviewed Core archives
        run: |
          set -euo pipefail
          base=https://bitcoincore.org/bin/bitcoin-core-32.0/test.rc2
          cd vendor
          curl -fL --retry 3 "$base/bitcoin-32.0rc2-x86_64-linux-gnu.tar.gz" -o bitcoin-32.0rc2-x86_64-linux-gnu.tar.gz
          curl -fL --retry 3 "$base/bitcoin-32.0rc2-aarch64-linux-gnu.tar.gz" -o bitcoin-32.0rc2-aarch64-linux-gnu.tar.gz
          sha256sum -c SHA256SUMS
      - name: Commit frozen Core archives
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/*.tar.gz
          git commit -m "Vendor Bitcoin Core 32.0rc2"
          git config http.postBuffer 209715200
          git push origin HEAD:simplify-auditability
