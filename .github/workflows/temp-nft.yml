name: Temporary nft syntax check
on: [push]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y nftables
      - name: Check exact Glacier nft rules
        run: |
          cat >/tmp/glacier.nft <<'EOF'
          table inet glacier2 {
           chain input { type filter hook input priority -300; policy drop; iifname "lo" accept; }
           chain output { type filter hook output priority -300; policy drop; oifname "lo" accept; }
          }
          EOF
          sudo nft -c -f /tmp/glacier.nft
