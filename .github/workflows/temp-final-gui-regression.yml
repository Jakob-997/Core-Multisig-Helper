name: Temporary final GUI security regression
on: [push]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static security checks
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck jq xorriso xvfb
          bash -n setup.sh
          shellcheck setup.sh
          test "$(wc -l < setup.sh)" -lt 200
          grep -Fq 'set -Eeuo pipefail' setup.sh
          grep -Fq 'umask 077' setup.sh
          grep -Fq 'swapoff -a' setup.sh
          grep -Fq 'networkactive=0' setup.sh
          grep -Fq 'policy drop' setup.sh
          grep -Fq 'timestamp:0' setup.sh
          grep -Fq 'cp "$STATE/descriptors.txt" "$STATE/cd/"' setup.sh
          ! grep -Fq 'setup.sh bitcoin-core.tar.gz "$STATE/cd/"' setup.sh
          echo '0255103718033e6aee15fa944717fc277e047b845bff1e7408af0ea732d8d0c1  bitcoin-core.tar.gz' | sha256sum -c -
          curl -fsS https://bitcoincore.org/bin/bitcoin-core-32.0/test.rc2/SHA256SUMS | grep -F '0255103718033e6aee15fa944717fc277e047b845bff1e7408af0ea732d8d0c1  bitcoin-32.0rc2-x86_64-linux-gnu.tar.gz'

      - name: Generate sign finalize backup restore and launch GUI
        run: |
          set -Eeuo pipefail
          T=/tmp/cmh
          C=$T/core
          D=$T/data
          mkdir -p "$C" "$D"
          tar -xzf bitcoin-core.tar.gz --strip-components=1 -C "$C"
          "$C/bin/bitcoind" -regtest -datadir="$D" -daemonwait -networkactive=0 -listen=0 -fallbackfee=0.0002 -rpcport=18459
          rpc(){ "$C/bin/bitcoin-cli" -regtest -datadir="$D" -rpcport=18459 "$@"; }
          node(){ local m=$1; shift; printf '%s\n' "$@" | rpc -stdin "$m"; }
          wallet(){ local w=$1 m=$2; shift 2; printf '%s\n' "$@" | rpc -rpcwallet="$w" -stdin "$m"; }
          trap 'rpc stop >/dev/null 2>&1 || true' EXIT

          M=2; N=4
          declare -a origin xpub xprv
          for ((i=1;i<=N;i++)); do
            w=signer_$i
            node createwallet "$w" false true >/dev/null
            root=$(rpc -rpcwallet="$w" addhdkey | jq -er .xpub)
            account=$(wallet "$w" derivehdkey m/87h/0h/0h "{\"hdkey\":\"$root\",\"private\":true}")
            origin[i]=$(jq -er .origin <<<"$account")
            xpub[i]=$(jq -er .xpub <<<"$account")
            xprv[i]=$(jq -er .xprv <<<"$account")
          done

          raw="wsh(sortedmulti($M"
          for ((i=1;i<=N;i++)); do raw+=",${origin[i]}${xpub[i]}/<0;1>/*"; done
          raw+='))'
          info=$(node getdescriptorinfo "$raw")
          test "$(jq '.multipath_expansion|length' <<<"$info")" = 2
          checksum=$(jq -er .checksum <<<"$info")
          public="$raw#$checksum"
          printf '%s\n' "$public" > "$T/descriptors.txt"

          node createwallet watch_only true true >/dev/null
          request=$(jq -cn --arg desc "$public" '[{desc:$desc,active:true,timestamp:0,range:[0,999]}]')
          wallet watch_only importdescriptors "$request" | jq -e '.[0].success == true'
          rpc -rpcwallet=watch_only getwalletinfo | jq -e '.private_keys_enabled == false'

          for ((i=1;i<=N;i++)); do
            private="${raw/${xpub[i]}/${xprv[i]}}"
            checksum=$(node getdescriptorinfo "$private" | jq -er .checksum)
            request=$(jq -cn --arg desc "$private#$checksum" '[{desc:$desc,active:true,timestamp:0,range:[0,999]}]')
            wallet "signer_$i" importdescriptors "$request" | jq -e '.[0].success == true'
          done

          addr=$(rpc -rpcwallet=watch_only getnewaddress)
          test "$addr" = "$(rpc -rpcwallet=signer_1 getnewaddress)"
          test "$addr" = "$(rpc -rpcwallet=signer_2 getnewaddress)"
          mine=$(rpc -rpcwallet=watch_only getnewaddress)
          rpc generatetoaddress 101 "$mine" >/dev/null
          dest=$(rpc -rpcwallet=signer_4 getnewaddress)
          psbt=$(rpc -rpcwallet=watch_only -named walletcreatefundedpsbt inputs='[]' outputs="{\"$dest\":1}" | jq -er .psbt)
          p1=$(rpc -rpcwallet=signer_1 walletprocesspsbt "$psbt" | jq -er .psbt)
          p2=$(rpc -rpcwallet=signer_2 walletprocesspsbt "$psbt" | jq -er .psbt)
          combined=$(rpc combinepsbt "[\"$p1\",\"$p2\"]")
          rpc finalizepsbt "$combined" | jq -e '.complete == true'

          rpc -rpcwallet=signer_1 backupwallet "$T/signer.dat"
          rpc stop
          trap - EXIT
          sleep 2

          G=$T/gui
          mkdir -p "$G/wallets/signer"
          cp "$T/signer.dat" "$G/wallets/signer/wallet.dat"
          Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 1
          "$C/bin/bitcoin-qt" -regtest -datadir="$G" -walletdir="$G/wallets" -networkactive=0 -listen=0 -rpcport=18460 -wallet=signer >/tmp/bitcoin-qt.log 2>&1 &
          QPID=$!
          for i in {1..30}; do
            if "$C/bin/bitcoin-cli" -regtest -datadir="$G" -rpcport=18460 -rpcwallet=signer getwalletinfo >"$T/gui-wallet.json" 2>/dev/null; then break; fi
            sleep 1
          done
          jq -e '.private_keys_enabled == true' "$T/gui-wallet.json"
          "$C/bin/bitcoin-cli" -regtest -datadir="$G" -rpcport=18460 getnetworkinfo | jq -e '.networkactive == false'
          "$C/bin/bitcoin-cli" -regtest -datadir="$G" -rpcport=18460 stop
          for i in {1..10}; do kill -0 "$QPID" 2>/dev/null || break; sleep 1; done
          kill "$QPID" 2>/dev/null || true
